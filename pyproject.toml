[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hetu-stock"
version = "0.1.0"
description = "Portable Agent Skill helpers for evidence-based A-share stock analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.13,<3",
  "typer>=0.26,<1",
  "pyyaml>=6.0,<7",
  "markdown-it-py>=4.0,<5",
  "pypdf>=6.16,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
hetu-stock = "hetu_stock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hetu_stock"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
